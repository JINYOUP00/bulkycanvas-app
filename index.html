<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>따라 그림 · DRAWLLOW</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="따라 그림">
<meta name="theme-color" content="#1F2023">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: 짙은 숯색 바탕 + 겨자색 포인트, 큼직한 둥근 글씨와 알약 모양 버튼. 데스크톱은 폰 + 오른쪽 메모 */
:root{
  --page:#141517; --phone:#1F2023; --surface:#2A2B2F; --surface2:#34363B; --ink:#FFFFFF; --sub:#A3A5AA; --line:#3A3C41;
  --accent:#F2B552; --accent-deep:#D0963A; --on-accent:#1F2023; --hl:#FF9F1C; --canvas:#A8A8A8;
  --f-en:"Manrope","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"Manrope","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;letter-spacing:-.005em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
.wrap{display:flex;gap:44px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 56px);min-height:660px;background:var(--phone);border-radius:44px;
  border:10px solid #000;box-shadow:0 30px 70px -30px rgba(0,0,0,.8);overflow:hidden;display:flex;flex-direction:column;position:relative}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 항상 떠 있는 광고 띠 */
.adbar{flex:none;display:flex;align-items:center;gap:12px;height:64px;padding:0 16px;background:#FFFFFF;color:#1F2023;border-top:1px solid var(--line);position:relative}
.adtag{position:absolute;left:4px;top:3px;font-family:var(--f-en);font-size:9px;font-weight:600;background:#F2B552;color:#1F2023;padding:0 4px;border-radius:3px;line-height:14px}
.adic{flex:none;width:40px;height:40px;border-radius:10px;background:#1F2023;color:#F2B552;font-family:var(--f-en);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.adtx{flex:1;min-width:0;line-height:1.3}
.adtx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adtx span{font-size:11.5px;color:#6B6E74;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.adcta{flex:none;background:#1F2023;color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700}

/* 홈 */
.home{flex:1;min-height:0;overflow:auto;padding:40px 24px 28px;display:flex;flex-direction:column;gap:28px}
.brand{text-align:center;padding:8px 0 6px}
.brand small{display:block;font-size:16px;color:var(--sub);margin-bottom:8px}
.brand b{display:block;font-family:var(--f-en);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em;color:var(--accent)}
.hero{border:0;padding:0;background:var(--canvas);border-radius:28px;overflow:hidden;text-align:left;position:relative;display:block;width:100%}
.hero img{display:block;width:100%;aspect-ratio:394/400;object-fit:cover;object-position:center 62%}
.hero .meta{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 20px;background:linear-gradient(transparent,rgba(20,21,23,.85));color:#fff}
.hero .meta b{font-size:24px;font-weight:700;display:block;letter-spacing:-.01em}
.hero .meta b em{font-family:var(--f-en);font-style:normal;color:var(--accent)}
.hero .meta span{font-size:14px;opacity:.75;display:block;margin-top:4px}
.hero .go{position:absolute;right:18px;top:18px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:700}
.sect{font-size:18px;font-weight:700;margin-bottom:-12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lock{border-radius:22px;overflow:hidden;background:var(--surface);position:relative}
.lock img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;filter:brightness(.6)}
.lock .tag{position:absolute;left:10px;top:10px;font-family:var(--f-en);font-weight:600;font-size:13px;background:var(--accent);color:var(--on-accent);padding:2px 9px;border-radius:999px}
.lock button{position:absolute;left:10px;right:10px;bottom:10px;border:0;border-radius:999px;padding:10px 0;background:#000;color:#fff;font-size:14px;font-weight:700}
.prep{border:0;background:var(--surface);border-radius:22px;padding:18px 20px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.prep .ico{flex:none;width:46px;height:46px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.prep b{display:block;font-size:16.5px;margin-bottom:2px}
.prep span{font-size:14px;color:var(--sub)}
.prep .st{margin-left:auto;flex:none;font-size:15px;font-weight:700;color:var(--accent)}

/* 튜토리얼 */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.ttl{flex:1;min-width:0;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl em{font-family:var(--f-en);font-style:normal;color:var(--accent)}
.count{font-family:var(--f-en);font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-weight:600}
.gear{border:0;background:var(--surface);border-radius:999px;height:34px;padding:0 12px;font-size:13px;font-weight:700}
.bar{flex:none;height:4px;background:var(--surface);margin:0 20px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.stages{flex:none;display:flex;gap:8px;overflow-x:auto;padding:16px 20px 14px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{flex:none;border:0;background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--sub)}
.stg small{display:none}
.stg.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.stg.done{color:var(--ink)}
.body{flex:1;min-height:0;overflow:auto;padding:0 20px 16px;display:flex;flex-direction:column;gap:20px}
.home>*,.setup>*,.body>*{flex:none}
.cv{position:relative;background:var(--canvas);border-radius:24px;overflow:hidden;height:280px;touch-action:pan-y}
.cv .stack{position:absolute;inset:0;margin:auto;height:100%;aspect-ratio:394/656}
.cv img{position:absolute;inset:0;width:100%;height:100%;display:block}
.cv .cur.play{animation:reveal .9s ease-in-out 2}
.cv canvas.dw{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
@keyframes reveal{0%,25%{opacity:0}75%,100%{opacity:1}}
.cv .hl{position:absolute;inset:0;opacity:.8;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:.4}}
.cv .tools{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
.cv .tools button{border:0;background:#000;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.cv .tools button[aria-pressed="false"]{background:rgba(0,0,0,.35)}
.zoomhint{position:absolute;left:14px;top:14px;background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px}
.specs{display:flex;margin:0;padding:2px 0}
.spec{flex:1;min-width:0;padding:0 14px;border-left:1px solid var(--line)}
.spec:first-child{padding-left:4px;border-left:0}
.spec.wide{flex:.8}
.spec dt{font-size:12.5px;color:var(--sub);margin-bottom:4px}
.spec dd{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec dd .en{font-family:var(--f-en);font-weight:600}
.spec dd small{display:none}
.sw{width:18px;height:18px;border-radius:6px;border:1px solid var(--line);flex:none}
.dot{border-radius:50%;background:var(--ink);flex:none}
.chk{font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);padding:1px 6px;border-radius:999px}
.intro{background:var(--accent);color:var(--on-accent);border-radius:22px;padding:18px 20px;font-size:15px;line-height:1.6}
.intro b{display:block;font-size:17px;margin-bottom:6px}
.note{display:flex;gap:12px;align-items:flex-start}
.ava{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--f-en);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.bubble{flex:1;min-width:0;background:var(--surface);border-radius:6px 22px 22px 22px;padding:16px 18px;font-size:16px;line-height:1.65}
.bubble .who{font-size:12.5px;color:var(--sub);display:block;margin-bottom:6px}
.listen{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.say{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;height:36px;padding:0 16px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.say .ic{font-size:11px}
.say.on{background:var(--ink);color:var(--phone)}
.auto{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
.auto input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.nav{flex:none;display:flex;gap:10px;padding:14px 20px 18px}
.nav button{border:0;border-radius:999px;height:58px;font-size:18px;font-weight:700}
.nav .prev{flex:1;background:var(--surface)}
.nav .next{flex:2;background:var(--accent);color:var(--on-accent)}
.nav button:disabled{opacity:.35;cursor:default}

/* 시작 전 준비 */
.setup{flex:1;min-height:0;overflow:auto;padding:8px 24px 18px;display:flex;flex-direction:column;gap:22px}
.setup h2{font-weight:700;font-size:26px;line-height:1.25;margin:4px 0 0;text-wrap:balance}
.setup .lead{margin:-10px 0 0;color:var(--sub);font-size:15px;line-height:1.65}
.brushcard{display:flex;gap:16px;align-items:center;background:var(--accent);border-radius:22px;padding:18px 20px;color:var(--on-accent)}
.brushcard svg{flex:none}
.brushcard b{display:block;font-family:var(--f-en);font-weight:700;font-size:20px}
.brushcard span{font-size:14px}
.ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ol li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:20px;padding:16px 18px;border:2px solid transparent}
.ol input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent)}
.ol label{flex:1;min-width:0;font-size:15px;cursor:pointer}
.ol label b{display:block;font-size:16.5px}
.ol label small{display:block;color:var(--sub);font-size:14px;margin-top:6px;line-height:1.6}
.ol li.ok{border-color:var(--accent)}

/* 오른쪽 메모 */
.notes{width:400px;max-width:100%;min-width:0;display:flex;flex-direction:column;gap:28px;padding-top:12px}
.notes h1{font-weight:700;font-size:30px;line-height:1.25;margin:0;text-wrap:balance}
.notes h1 em{font-family:var(--f-en);font-style:normal;color:var(--accent)}
.notes p{margin:0;color:var(--sub)}
.notes h2{font-size:15px;margin:0 0 10px;color:var(--accent)}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:#D8D9DC;line-height:1.65}
.notes li::marker{color:var(--accent)}
.box{border-top:1px solid var(--line);padding-top:22px}
@media (max-width:480px){
  body{padding-block:0}
  .phone{border:0;border-radius:0;box-shadow:none;height:100vh;max-height:none;min-height:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));width:calc(100% + 32px);max-width:none}
}
@media (prefers-reduced-motion:reduce){.cv .cur.play,.cv .hl{animation:none}}

/* ── 전체: 가늘고 작게 ── */
body{font-size:15px;font-weight:400;letter-spacing:-.01em}
.brand small{font-size:14px;font-weight:300}
.brand b{font-size:38px;letter-spacing:-.035em}
.prep{padding:15px 18px}.prep b{font-size:15px;font-weight:600}.prep span{font-size:12.5px;font-weight:300}.prep .st{font-size:13px;font-weight:600}
.prep .ico{width:40px;height:40px;font-size:12px;font-weight:600}
.hero .meta b{font-size:20px;font-weight:600}.hero .meta span{font-size:12.5px;font-weight:300}
.hero .go{font-size:13px;font-weight:600;padding:7px 14px}
.sect{font-size:15px;font-weight:600}
.lock .tag{font-size:11.5px}.lock button{font-size:12.5px;font-weight:500;padding:9px 0}
.setup h2{font-size:22px;font-weight:600}.setup .lead{font-size:13.5px;font-weight:300}
.brushcard b{font-size:17px}.brushcard span{font-size:12.5px}
.ol label b{font-size:14.5px;font-weight:600}.ol label small{font-size:12.5px;font-weight:300}
.nav button{height:50px;font-size:15px;font-weight:600}
.top .ttl{font-size:15.5px;font-weight:500}
.adtx b{font-size:13px;font-weight:600}.adtx span{font-weight:300}
.notes h1{font-weight:600}.notes ul{font-weight:300}
/* ── 그리기 화면 B: 영화 자막 ── */
.cv{flex:1;min-height:0;height:auto;margin:0;border-radius:0;position:relative;overflow:hidden;background:var(--canvas);touch-action:pan-y}
.cv .stack{position:absolute;inset:0 auto 0 50%;transform:translateX(-50%);height:100%;width:auto;aspect-ratio:394/656;margin:0;max-width:none}
.cv .gt{position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(rgba(20,21,23,.62),rgba(20,21,23,0));pointer-events:none}
.cv .gb{position:absolute;left:0;right:0;bottom:0;height:260px;background:linear-gradient(rgba(20,21,23,0),rgba(20,21,23,.82));pointer-events:none}
.glassb,.ib,.mini,.ov-tools button,.rb,.pb{background:rgba(22,23,26,.42);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.1);color:#fff}
.hdr{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:8px;font-size:13px}
.hdr .ib{width:30px;height:30px;border-radius:50%;font-size:16px;padding:0;line-height:1}
.hdr .ttl{flex:1;min-width:0;font-weight:400;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .ttl b{font-family:var(--f-en);font-weight:700;color:var(--accent)}
.hdr .mini{height:26px;border-radius:999px;padding:0 10px;font-size:11px;font-weight:500}
.hdr .count{font-family:var(--f-en);font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.seg{position:absolute;left:16px;right:16px;top:52px;display:flex;gap:4px}
.sg{flex:1;height:14px;border:0;background:none;padding:5px 0;cursor:pointer}
.sg::before{content:"";display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.28)}
.sg i{display:block;height:3px;border-radius:2px;background:#fff;margin-top:-3px;width:0}
.sg.on i{background:var(--accent)}
.stl{position:absolute;left:16px;right:60px;top:72px;color:#fff;pointer-events:none}
.stl span{font-size:11.5px;font-weight:500;opacity:.9}
.stl p{margin:6px 0 0;font-size:12px;font-weight:300;line-height:1.55;opacity:.9;max-width:300px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.ov-tools{position:absolute;right:12px;top:42%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.ov-tools button{width:32px;height:32px;border-radius:50%;font-size:12.5px;font-weight:500;padding:0;display:flex;align-items:center;justify-content:center}
.ov-tools #replay{font-size:24px;line-height:1}
.ov-tools #hlb[aria-pressed="false"]{opacity:.5}
.ov-tools #hide[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sub{position:absolute;left:22px;right:22px;bottom:96px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;color:#fff;transition:opacity .2s}
.meta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:rgba(255,255,255,.72);font-weight:400;flex-wrap:wrap;justify-content:center}
.meta .en{font-family:var(--f-en);font-weight:600;color:#fff}
.meta i{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.35)}
.meta .sw{width:10px;height:10px;border-radius:3px;border:1px solid rgba(255,255,255,.3)}
.meta .dot{background:#fff;border-radius:50%}
.sub .note{margin:0;font-size:13.5px;line-height:1.6;font-weight:300;text-shadow:0 1px 8px rgba(0,0,0,.45);text-wrap:balance}
.cv.bare .sub,.cv.bare .stl p{opacity:0}
.ctl{position:absolute;left:16px;right:16px;bottom:20px;display:flex;align-items:center;justify-content:space-between}
.rb{width:52px;height:52px;border-radius:50%;font-size:22px;font-weight:300;padding:0;line-height:1}
.rb.nx{background:var(--accent);color:var(--on-accent);border:0;font-weight:500}
.rb:disabled{opacity:.3;cursor:default}
.ctl .mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.pb{width:44px;height:44px;border-radius:50%;padding:0;font-size:12px;display:flex;align-items:center;justify-content:center}
.pb.on{background:#fff;color:#1F2023}
.langs{align-self:flex-end;display:flex;background:var(--surface);border-radius:999px;padding:3px;margin-bottom:-14px}
.langs button{border:0;background:none;color:var(--sub);font-size:11.5px;font-weight:500;padding:4px 11px;border-radius:999px}
.langs button.on{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ── 글씨 한 단계 키움 + 아래쪽 버튼 줄 새 배치 ── */
body{font-size:16px;word-break:keep-all;overflow-wrap:anywhere}
.brand small{font-size:15px}.brand b{font-size:40px}
.prep b{font-size:16px}.prep span{font-size:13.5px}.prep .st{font-size:14px}
.hero .meta b{font-size:21px}.hero .meta span{font-size:13.5px}.hero .go{font-size:14px}
.sect{font-size:16px}.lock button{font-size:13.5px}.langs button{font-size:12.5px}
.setup h2{font-size:23px}.setup .lead{font-size:14.5px}.ol label b{font-size:15.5px}.ol label small{font-size:13.5px}
.hdr{top:14px}.hdr .ib{width:34px;height:34px;font-size:18px}
.hdr .ttl{font-size:15px}.hdr .mini{height:30px;font-size:12.5px;padding:0 12px}.hdr .count{font-size:13px}
.seg{top:58px}.stl{top:80px}
.stl span{font-size:13px}.stl p{font-size:13.5px;max-width:310px}
.ov-tools button{width:36px;height:36px;font-size:13.5px}
.ov-tools #replay{font-size:27px}
.meta{font-size:12px;gap:7px}.meta .sw{width:11px;height:11px}
.sub{bottom:92px;gap:9px;left:20px;right:20px}
.sub .note{font-size:15.5px;line-height:1.6}
.ctl{left:14px;right:14px;bottom:22px;gap:8px}
.rb{width:50px;height:50px;flex:none}
.ctl .mid{flex:1;min-width:0;flex-direction:row;justify-content:center;gap:8px}
.pill{height:46px;border-radius:999px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;white-space:nowrap;background:rgba(22,23,26,.42);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.14);color:#fff}
.pill .ic{font-size:11px}
.pill.on{background:#fff;color:#1F2023;border-color:#fff}
.pill.auto{font-weight:500}
.pill.auto.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.pill .hp{flex:none}

/* ── 화면 방향은 그림을 따른다 (폰을 어떻게 들든) ──

.cbar{position:absolute;left:10px;right:10px;bottom:10px;width:auto;max-width:none;height:100px;aspect-ratio:auto;border-radius:28px;align-items:flex-start;justify-content:center;padding:9px 16px 0;z-index:0}

@media (max-width:359px){.cbar ~ .ctl{left:12px;right:12px;bottom:12px}.cbar .spx{left:12px}.cbar{padding-left:12px;padding-right:12px}.cbar ~ .ctl .mid{gap:6px}.cbar ~ .ctl .mid > #hide{width:40px}}

  const isFirst = stageFirst[s.stage] === cur;
  document.getElementById('stl').innerHTML = `<span>${tr('stage')(s.stage+1, st['name'+SUF()])}</span>` + (isFirst ? `<p>${st['intro'+SUF()]}</p>` : '');
  const dpx = Math.max(3, Math.min(10, s.w*1.1));
  document.getElementById('specs').innerHTML =
    `<span class="en">Ink roll</span><span class="dot" style="width:${dpx}px;height:${dpx}px"></span><span class="en">${s.w}%</span>`;
  // 지금 색: 아래 긴 막대(가로:세로 15:1) 위에 색 이름과 RGB 값
  const hx = (s.hex || '#888888').replace('#', ''), rgb = [0, 2, 4].map(i => parseInt(hx.slice(i, i + 2), 16));
  const cb = document.getElementById('cbar'), lum = (rgb[0]*299 + rgb[1]*587 + rgb[2]*114) / 1000;
  cb.style.background = '#' + hx; cb.classList.toggle('light', lum > 150);
  const cfo = document.getElementById('cfold'); if (cfo) { cfo.style.setProperty('--cc', '#' + hx); cfo.classList.toggle('light', lum > 150); }
  document.getElementById('cbn').textContent = '';
  document.getElementById('cbv').textContent = 'RGB ' + rgb.join(' ');
  cb.setAttribute('aria-label', `RGB ${rgb.join(', ')}`);
  document.getElementById('note').textContent = s['note'+SUF()] || '';
  document.getElementById('say').disabled = !sayText();
  document.getElementById('prev').disabled = cur===1;
  const nx = document.getElementById('next'); nx.disabled = false; nx.classList.toggle('fin', cur === N); nx.innerHTML = cur === N ? checkSvg : chevR; nx.setAttribute('aria-label', cur === N ? tr('finish') : tr('nextA'));
  if (cur === N) document.getElementById('note').textContent = s['note'+SUF()] ? (s['note'+SUF()] + ' ' + tr('doneMsg')) : tr('doneMsg').replace(/^[—–-]\s*/, '');
}
document.addEventListener('keydown', e => { if (view!=='tut') return; if (e.key==='ArrowRight') go(cur+1); if (e.key==='ArrowLeft') go(cur-1); });
home();
</script>
