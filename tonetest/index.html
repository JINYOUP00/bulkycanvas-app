<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>톤 시험</title>
<style>
:root{--bg:#58585A}
html,body{margin:0;background:var(--bg);color:#fff;font:14px -apple-system,sans-serif}
.top{padding:14px 16px 6px;line-height:1.5}
.top b{color:#f5c76a}
.tabs{display:flex;gap:8px;padding:0 16px 10px}
.tabs button{flex:1;padding:9px 0;border-radius:18px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);color:#fff;font-size:14px}
.tabs button.on{background:#f5c76a;color:#222;border-color:#f5c76a}
.row{display:flex;gap:12px;padding:0 16px}
.col{flex:1;min-width:0;text-align:center}
.col p{margin:0 0 6px;font-weight:600}
.box{position:relative;width:100%;aspect-ratio:788/1320;overflow:hidden}
.box video,.box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.box video.src{opacity:0.01;pointer-events:none}
.st{margin:6px 0 0;font-size:12px;opacity:.8;min-height:1.2em}
.go{display:block;margin:14px 16px 24px;width:calc(100% - 32px);padding:13px 0;border-radius:24px;border:0;background:#f5c76a;color:#222;font-size:16px;font-weight:700}
</style></head><body>
<div class="top">붓질이 <b>움직일 때</b>와 <b>멈출 때</b>(2초 쉼) 톤이 바뀌는지 보세요.<br>왼쪽 = 지금 앱 방식, 오른쪽 = 고친 방식(그림판에 옮겨 그림)</div>
<div class="tabs"><button id="t1" class="on" type="button">눈</button><button id="t2" type="button">뛰어오르는 사슴</button></div>
<div class="row">
  <div class="col"><p>A 지금 방식</p><div class="box" id="ba"><video id="va" muted playsinline webkit-playsinline preload="auto"></video></div><div class="st" id="sa"></div></div>
  <div class="col"><p>B 고친 방식</p><div class="box" id="bb"><canvas id="cb"></canvas><video id="vb" class="src" muted playsinline webkit-playsinline preload="auto"></video></div><div class="st" id="sb"></div></div>
</div>
<button class="go" id="go" type="button">▶ 재생 시작</button>
<script>
const CLIPS = {t1: ['eye.mp4', '#58585A'], t2: ['deer.mp4', '#2C311B']};
const va = document.getElementById('va'), vb = document.getElementById('vb'), cb = document.getElementById('cb'), x = cb.getContext('2d');
let seq = 0;
function load(id){
  const [src, bg] = CLIPS[id];
  document.documentElement.style.setProperty('--bg', bg);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.id === id));
  seq++; [va, vb].forEach(v => { v.pause(); v.src = src; v.load(); });
}
// 앱과 같게: 2배 느리게 재생 → 끝에서 2초 멈춤 → 처음부터 다시
function loop(v, st, draw){
  const my = seq;
  const run = () => {
    if (my !== seq) return;
    try { v.currentTime = 0; } catch(e) {}
    v.playbackRate = 0.5;
    const p = v.play(); if (p && p.catch) p.catch(() => {});
    st.textContent = '움직이는 중';
  };
  v.onended = () => { if (my !== seq) return; st.textContent = '멈춤 (2초)'; if (draw) draw(); setTimeout(run, 2000); };
  run();
}
function paint(){ if (vb.readyState >= 2) { if (cb.width !== vb.videoWidth) { cb.width = vb.videoWidth; cb.height = vb.videoHeight; } x.drawImage(vb, 0, 0, cb.width, cb.height); } }
function tick(){ paint(); requestAnimationFrame(tick); }
requestAnimationFrame(tick);
vb.addEventListener('loadeddata', paint);
document.getElementById('go').onclick = () => { loop(va, document.getElementById('sa')); loop(vb, document.getElementById('sb'), paint); };
document.getElementById('t1').onclick = () => { load('t1'); document.getElementById('sa').textContent = document.getElementById('sb').textContent = '▶ 재생 시작을 누르세요'; };
document.getElementById('t2').onclick = () => { load('t2'); document.getElementById('sa').textContent = document.getElementById('sb').textContent = '▶ 재생 시작을 누르세요'; };
load('t1');
</script></body></html>
